<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat API test</title>
<style>
  body { font-family: monospace; background: #fff; color: #000; max-width: 720px; margin: 20px auto; padding: 0 10px; }
  #meta { margin-bottom: 10px; }
  #messages { border: 1px solid #000; height: 60vh; overflow-y: auto; padding: 10px; }
  .msg { margin: 0 0 12px; white-space: pre-wrap; }
  .error { border: 2px solid #000; padding: 6px; font-weight: bold; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  input, button { font: inherit; border: 1px solid #000; background: #fff; color: #000; padding: 6px; }
  input { flex: 1; }
  button:disabled { color: #888; border-color: #888; }
</style>
</head>
<body>
<h1>Chat API test</h1>
<div id="meta">Loading config...</div>
<div id="messages"></div>
<form id="form">
  <input id="input" autocomplete="off" placeholder="Type a message" autofocus>
  <button id="send" type="submit">Send</button>
</form>
<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const history = [];

fetch("/api/config").then(r => r.json()).then(c => {
  document.getElementById("meta").textContent = `Model: ${c.model} | Base URL: ${c.baseUrl}`;
});

function addMessage(label, text, isError) {
  const div = document.createElement("div");
  div.className = "msg" + (isError ? " error" : "");
  const strong = document.createElement("strong");
  strong.textContent = label + ": ";
  const body = document.createElement("span");
  body.textContent = text;
  div.append(strong, body);
  messagesEl.append(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return body;
}

// Handles the native Llama API stream shape and the OpenAI-compatible one (Ollama).
function deltaText(data) {
  if (data.event && data.event.delta) return data.event.delta.text || "";
  if (data.choices && data.choices[0] && data.choices[0].delta) return data.choices[0].delta.content || "";
  return "";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendBtn.disabled = true;
  addMessage("You", text);
  history.push({ role: "user", content: text });

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      const err = body.error || {};
      addMessage("Error", `${err.status || res.status}: ${err.message || res.statusText}`, true);
      history.pop();
      return;
    }

    const out = addMessage("Assistant", "");
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let reply = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        let data;
        try { data = JSON.parse(payload); } catch { continue; }
        if (data.error) {
          addMessage("Error", `stream: ${data.error.message || JSON.stringify(data.error)}`, true);
          continue;
        }
        reply += deltaText(data);
        out.textContent = reply;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }
    history.push({ role: "assistant", content: reply });
  } catch (err) {
    addMessage("Error", `Network error: ${err.message}`, true);
    history.pop();
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
